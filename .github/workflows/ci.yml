name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    - name: Check editor benchmark
      run: python3 -m unittest discover -s tools -p 'test_editor*.py' -v

    - name: Check headless library
      run: cargo test --locked --workspace --no-default-features --lib --tests --examples

    - name: Check standalone engine boundary
      run: |
        cargo test --locked -p rune-core
        cargo tree --locked -p rune-core --edges normal --prefix none > /tmp/rune-core-deps.txt
        python3 - <<'PYTHON'
        from pathlib import Path
        names = {line.split()[0] for line in Path('/tmp/rune-core-deps.txt').read_text().splitlines()}
        forbidden = {'rune', 'ratatui', 'crossterm', 'clap', 'gpui', 'ureq', 'toml', 'dirs', 'ignore'}
        assert not names & forbidden, f'Frontend dependencies leaked into rune-core: {names & forbidden}'
        PYTHON

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Build
      run: cargo build --verbose
      
    - name: Build release
      run: cargo build --release --verbose
