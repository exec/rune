[package]
name = "rune"
version = "1.7.0"
authors = ["exec"]
description = "A modern CLI text editor that bridges the gap between nano's simplicity and advanced features"
license = "MIT"
repository = "https://github.com/exec/rune"
readme = "README.md"
keywords = ["editor", "terminal", "cli", "text", "nano"]
categories = ["command-line-utilities", "text-editors"]
edition = "2021"
exclude = [
    "homebrew-setup/",
    "aur-rune-editor/",
    "test.txt",
    "*.tmp",
    "*.temp"
]

[[bin]]
name = "rune"
path = "src/main.rs"
required-features = ["terminal"]

[features]
default = ["terminal"]
terminal = [
    "dep:ratatui", "dep:crossterm", "dep:clap", "dep:serde",
    "dep:toml", "dep:dirs", "dep:ignore", "dep:ureq",
]

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
ropey = "1.6"
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
unicode-width = "0.2"
dirs = { version = "5.0", optional = true }
regex = "1.10"
ignore = { version = "0.4", optional = true }
phf = { version = "0.11", features = ["macros"] }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "editor_perf"
harness = false
required-features = ["terminal"]

[[bench]]
name = "document_perf"
harness = false
