[package]
name = "rune-core"
version = "0.1.0"
edition = "2021"
description = "Shared document editing engine for Rune and Etch"
license = "MIT"
readme = "README.md"
repository = "https://github.com/exec/rune"

[dependencies]
ropey = "1.6"
anyhow = "1.0"
unicode-width = "0.2"
regex = "1.10"
phf = { version = "0.11", features = ["macros"] }

[dev-dependencies]
tempfile = "3"
